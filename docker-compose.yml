services:
  postgres:
    image: postgres:16-alpine
    container_name: medsure_postgres
    restart: always
    environment:
      POSTGRES_USER: medsure
      POSTGRES_PASSWORD: medsure_password
      POSTGRES_DB: medsure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsure -d medsure_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medsure_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://medsure:medsure_password@postgres:5432/medsure_db
      - JWT_SECRET=super_secret_jwt_key_powerbank_hackathon_2026_change_in_production
      - LLM_PROVIDER=gemini
      - LLM_API_KEY=
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
